provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 180000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "sntx_sem"
    # Live eval перезаписывает command/args: SNTX_SEM_PYTHON или бинарь sntx-sem.
    command: "python"
    args: ["-m", "sntx_sem.mcp_server"]
    env:
      SNTX_SEM_CONFIG: "REQUIRED_SNTX_SEM_CONFIG"
    timeout_ms: 60000

  - name: "code-index"
    command: "REQUIRED_BSL_INDEXER"
    args: ["serve", "--path", "cf=../../../src/cf"]
    timeout_ms: 60000

  - name: "bsl-language-server"
    command: "node"
    args: ["REQUIRED_BSL_LS_MCP"]
    env:
      BSL_LS_JAR: "REQUIRED_BSL_LS_JAR"
      JAVA_HOME: "REQUIRED_JAVA_HOME"
    timeout_ms: 180000

limits:
  max_iterations: 80
  max_tokens: 800000
  max_duration_sec: 2400

logging:
  enable_ai_log: true
  enable_mcp_log: true
  enable_chat_history: false
  sink:
    type: file
    path: "./logs/1c-implementer"

access:
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
      - local_tools.search_docs
      - local_tools.read_file
  filesystem:
    home:
      read: ["."]
      write: ["out/", "notes/"]
    workspace:
      root: "../../../src/cf"
      read: ["."]
    input_roots:
      - "."
  run:
    programs:
      - name: rg
        executable: rg
      - name: git
        executable: git
