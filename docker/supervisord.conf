[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:code-index]
command=/opt/tools/bsl-indexer daemon run
directory=/data/code-index
environment=CODE_INDEX_HOME="/data/code-index"
autostart=true
autorestart=true
priority=10
stdout_logfile=/data/logs/code-index.log
stderr_logfile=/data/logs/code-index.err.log

[program:sntx-sem]
command=/app/docker/bin/run-sntx-sem.sh
directory=/opt/tools/1c-sntx-sem
autostart=true
autorestart=true
priority=20
stdout_logfile=/data/logs/sntx-sem.log
stderr_logfile=/data/logs/sntx-sem.err.log

[program:conf-doc]
command=/app/docker/bin/run-conf-doc.sh
directory=/data/conf-doc
autostart=true
autorestart=true
priority=20
stdout_logfile=/data/logs/conf-doc.log
stderr_logfile=/data/logs/conf-doc.err.log

[program:searxng]
command=/app/docker/bin/run-searxng.sh
directory=/opt/searxng
autostart=true
autorestart=true
priority=20
stdout_logfile=/data/logs/searxng.log
stderr_logfile=/data/logs/searxng.err.log

[program:mcp-searxng]
command=/app/docker/bin/run-mcp-searxng.sh
autostart=true
autorestart=true
priority=30
stdout_logfile=/data/logs/mcp-searxng.log
stderr_logfile=/data/logs/mcp-searxng.err.log

[program:portal]
command=/opt/web-venv/bin/uvicorn web.app:app --host 127.0.0.1 --port 18080
directory=/app
environment=PYTHONPATH="/app",DATA_DIR="/data"
autostart=true
autorestart=true
priority=40
stdout_logfile=/data/logs/portal.log
stderr_logfile=/data/logs/portal.err.log

[program:caddy]
command=/usr/local/bin/caddy run --config /data/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=50
stdout_logfile=/data/logs/caddy.log
stderr_logfile=/data/logs/caddy.err.log
